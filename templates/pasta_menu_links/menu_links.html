<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Lauany Fagundes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='pasta_menu_links/menu_links.css') }}">
</head>
<body>
    <button id="theme-toggle" class="theme-toggle" aria-label="Alternar modo de cor">
        <i class="fas fa-moon"></i>
    </button>

    <div class="bio-container">
        <header class="bio-header">
            <div class="profile-img">
                <img src="{{ url_for('static', filename='images/bloco_1/imagem_1.png') }}" alt="Lauany Fagundes">
            </div>
            <h1>Lauany Fagundes</h1>
            <p>Nutricionista | Personal Trainer</p>
        </header>

        <nav class="bio-links">
            <a href="https://wa.me/5565996852903?text=Olá%2C%20tenho%20interesse%20no%20acompanhamento%20nutricional." class="bio-link whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-heart-pulse"></i> Acompanhamento Nutricional
            </a>
            
            <a href="https://wa.me/5565996852903?text=Olá%2C%20quero%20saber%20mais%20sobre%20os%20treinos%20personalizados." class="bio-link" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-dumbbell"></i> Treinos Personalizados
            </a>

            <a href="https://wa.me/5565996852903?text=Olá%2C%20quero%20agendar%20uma%20consulta." class="bio-link whatsapp" target="_blank" rel="noopener noreferrer">
                <i class="fab fa-whatsapp"></i> Agendar Consulta WhatsApp
            </a>

            <a href="https://wa.me/5565996852903?text=Olá%2C%20quero%20marcar%20uma%20avaliação%20inicial." class="bio-link" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-calendar-check"></i> Marcar Avaliação Inicial
            </a>

            <a href="mailto:Lauanyminervino175@gmail.com" class="bio-link" target="_blank" rel="noopener noreferrer">
                <i class="fas fa-envelope"></i> Enviar Mensagem
            </a>
        </nav>

        <footer class="bio-footer">
            <p>© 2026 Lauany Fagundes | Transformando vidas com saúde</p>
        </footer>
    </div>

    <script>
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        const icon = themeToggle.querySelector('i');

        const savedTheme = localStorage.getItem('theme-links') || 
                          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');

        html.setAttribute('data-theme', savedTheme);
        updateIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', currentTheme);
            localStorage.setItem('theme-links', currentTheme);
            updateIcon(currentTheme);
        });

        function updateIcon(theme) {
            if (theme === 'dark') {
                icon.className = 'fas fa-sun';
            } else {
                icon.className = 'fas fa-moon';
            }
        }
    </script>
</body>
</html>
